name: Create release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, for example 2.0.0
        required: true
        type: string
      npm_tag:
        description: Optional npm dist-tag. Leave empty to auto-select latest or next
        required: false
        default: ''
        type: string

concurrency:
  group: release-makio-meshline
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Validate release request
        id: plan
        run: |
          VERSION="$RELEASE_VERSION"

          if [[ "$GITHUB_REF_NAME" != "main" ]]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi

          CURRENT_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('src/package.json', 'utf8')).version")

          if git rev-parse "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "Tag v$VERSION already exists."
            exit 1
          fi

          if [[ -n "$NPM_TAG_INPUT" ]]; then
            NPM_TAG="$NPM_TAG_INPUT"
          elif [[ "${VERSION%%+*}" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          node scripts/validate-release.mjs --version "$VERSION" --tag "$NPM_TAG"
          node -e '
            const fs = require( "fs" )
            const version = process.env.RELEASE_VERSION
            const heading = fs.readFileSync( "CHANGELOG.md", "utf8" )
              .split( /\r?\n/ )
              .find( line => line === `## ${version}` || line.startsWith( `## ${version} ` ) )
            if ( !heading || /unreleased/i.test( heading ) ) {
              console.error( `Finalize the CHANGELOG.md heading for ${version} before releasing.` )
              process.exit( 1 )
            }
          '

          if [[ "$CURRENT_VERSION" == "$VERSION" ]]; then
            echo "version_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "version_changed=true" >> "$GITHUB_OUTPUT"
          fi

          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
      - run: pnpm i --frozen-lockfile
      - run: pnpm -w run release:check
      - name: Update package version
        if: steps.plan.outputs.version_changed == 'true'
        run: npm version "$VERSION" --no-git-tag-version
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
      - name: Commit version bump
        if: steps.plan.outputs.version_changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/package.json
          git commit -m "chore: release v$VERSION"
          git push origin HEAD:main
        env:
          VERSION: ${{ inputs.version }}
      - name: Tag release commit
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
        env:
          VERSION: ${{ inputs.version }}
      - name: Dispatch and verify publish workflow
        run: |
          RELEASE_SHA=$(git rev-parse HEAD)
          DISPATCHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          gh api \
            --method POST \
            -H "Accept: application/vnd.github+json" \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/dispatches" \
            -f ref="v$VERSION" \
            -f 'inputs[version]'="$VERSION" \
            -f 'inputs[npm_tag]'="$NPM_TAG"

          RUN_ID=""
          for attempt in {1..30}; do
            RUN_ID=$(gh api \
              --method GET \
              "/repos/$GITHUB_REPOSITORY/actions/workflows/publish.yml/runs" \
              -f event=workflow_dispatch \
              -f head_sha="$RELEASE_SHA" \
              -f created=">=$DISPATCHED_AT" \
              -f per_page=10 \
              --jq '.workflow_runs | sort_by(.created_at) | last | .id // empty')
            if [[ -n "$RUN_ID" ]]; then break; fi
            sleep 2
          done

          if [[ -z "$RUN_ID" ]]; then
            echo "Publish workflow was dispatched, but its run could not be located."
            exit 1
          fi

          gh run watch "$RUN_ID" --exit-status
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
