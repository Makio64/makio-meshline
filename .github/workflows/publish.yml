name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to publish, for example 2.0.0
        required: true
        type: string
      npm_tag:
        description: Optional npm dist-tag. Leave empty to auto-select latest or next
        required: false
        default: ''
        type: string

concurrency:
  group: publish-makio-meshline
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Validate publish request
        id: plan
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Publish workflow must run from a git tag ref."
            exit 1
          fi

          if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Publish ref $GITHUB_REF_NAME does not match version v$VERSION."
            exit 1
          fi

          if [[ -n "$NPM_TAG_INPUT" ]]; then
            NPM_TAG="$NPM_TAG_INPUT"
          elif [[ "${VERSION%%+*}" == *-* ]]; then
            NPM_TAG="next"
          else
            NPM_TAG="latest"
          fi

          PLAN=$(node scripts/validate-release.mjs \
            --version "$VERSION" \
            --tag "$NPM_TAG" \
            --allow-published)
          ALREADY_PUBLISHED=$(node -p 'JSON.parse(process.argv[1]).alreadyPublished' "$PLAN")

          echo "$PLAN"
          echo "already_published=$ALREADY_PUBLISHED" >> "$GITHUB_OUTPUT"
          echo "npm_tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}
          NPM_TAG_INPUT: ${{ inputs.npm_tag }}
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'
      - run: pnpm i --frozen-lockfile
      - run: pnpm -w run release:check
      - name: Publish package
        id: publish_package
        run: |
          PACKAGE_NAME=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).name")
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")

          if [[ "$PACKAGE_VERSION" != "$VERSION" ]]; then
            echo "src/package.json version ($PACKAGE_VERSION) does not match requested version ($VERSION)."
            exit 1
          fi

          if [[ "$ALREADY_PUBLISHED" == "true" ]]; then
            echo "$PACKAGE_NAME@$VERSION is already published, skipping npm publish."
            exit 0
          fi

          npm publish --access public --provenance --tag "$NPM_TAG"
        working-directory: src
        env:
          VERSION: ${{ inputs.version }}
          NPM_TAG: ${{ steps.plan.outputs.npm_tag }}
          ALREADY_PUBLISHED: ${{ steps.plan.outputs.already_published }}
      - name: Create GitHub release
        run: |
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "GitHub release v$VERSION already exists, skipping."
            exit 0
          fi

          RELEASE_ARGS=(release create "v$VERSION" --verify-tag --title "v$VERSION" --generate-notes)
          if [[ "${VERSION%%+*}" == *-* ]]; then
            RELEASE_ARGS+=(--prerelease)
          fi

          gh "${RELEASE_ARGS[@]}"
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
