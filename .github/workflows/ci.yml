name: CI

on:
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4.4.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm i --frozen-lockfile
      - run: pnpm -w run lint
      - run: pnpm -w run test
      - run: pnpm -w run test:types
      - run: pnpm -w run build
      - run: pnpm -w run docs:build
      - run: pnpm --filter makio-meshline-vanilla-example build
      - run: pnpm --filter makio-meshline-r3f-example build
      - run: pnpm --filter makio-meshline-vue-example build
      - run: pnpm -w run verify:package
      - run: pnpm -w run verify:compat
      - name: Three.js dev branch compatibility canary
        continue-on-error: true
        run: pnpm -w run verify:compat:canary
