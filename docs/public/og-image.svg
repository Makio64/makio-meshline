<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Makio MeshLine V2. A hover car surrounded by glowing airflow lines in the Wind Tunnel WebGPU demo.">
	<defs>
		<linearGradient id="heading-shade" x1="0" y1="0" x2="0" y2="270" gradientUnits="userSpaceOnUse">
			<stop stop-color="#02040a" stop-opacity="0.95"/>
			<stop offset="0.55" stop-color="#02040a" stop-opacity="0.64"/>
			<stop offset="1" stop-color="#02040a" stop-opacity="0"/>
		</linearGradient>
		<linearGradient id="footer-shade" x1="0" y1="490" x2="0" y2="630" gradientUnits="userSpaceOnUse">
			<stop stop-color="#02040a" stop-opacity="0"/>
			<stop offset="1" stop-color="#02040a" stop-opacity="0.9"/>
		</linearGradient>
		<linearGradient id="mark-color" x1="54" y1="37" x2="75" y2="58" gradientUnits="userSpaceOnUse">
			<stop stop-color="#7346ff"/><stop offset="0.5" stop-color="#d43ac6"/><stop offset="1" stop-color="#ff6350"/>
		</linearGradient>
	</defs>
	<rect width="1200" height="630" fill="#02040a"/>
	<!-- Actual V2 Wind Tunnel demo frame, captured from /examples/wind-tunnel?noUI. -->
	<image href="og-wind-tunnel.jpg" width="1200" height="675" y="-22" preserveAspectRatio="xMidYMid slice"/>
	<rect width="1200" height="270" fill="url(#heading-shade)"/>
	<rect y="490" width="1200" height="140" fill="url(#footer-shade)"/>
	<circle cx="64" cy="48" r="9" stroke="url(#mark-color)" stroke-width="3.5"/>
	<text x="87" y="53" fill="#b8bfcc" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1.6">THREE.JS LINE LIBRARY</text>
	<text x="51" y="132" fill="#faf9f7" font-family="Arial, Helvetica, sans-serif" font-size="76" font-weight="700" letter-spacing="-3.2">Makio MeshLine</text>
	<text x="55" y="170" fill="#bdc4d0" font-family="Arial, Helvetica, sans-serif" font-size="23" letter-spacing="-0.3">TSL-powered lines for Three.js.</text>
	<text x="54" y="587" fill="#dce2ec" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" letter-spacing="0.6">WebGPU<tspan fill="#6c778b">  /  </tspan>WebGL2<tspan fill="#6c778b">  /  </tspan>TSL</text>
	<text x="1146" y="587" text-anchor="end" fill="#9da7b8" font-family="Arial, Helvetica, sans-serif" font-size="14">meshline.makio.io</text>
</svg>
